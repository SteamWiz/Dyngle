[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "dyngle"
description = "Run lightweight local workflows"
authors = ["Steampunk Wizard <dyngle@steamwiz.io>"]
license = "MIT"
readme = "PACKAGE.md"
version = "2.17.5"
homepage = 'https://dyngle.steamwiz.io'
repository = 'https://github.com/SteamWiz/Dyngle'

[tool.poetry.dependencies]
python = "^3.13"
wizlib = "^4.0.8"
requests = "^2.32.3"
black = "^25.11.0"
mcp = "^1.23.1"
jsonschema = "^4.25.0"

[tool.poetry.group.dev.dependencies]
pycodestyle = "^2.11.0"
autopep8 = "^2.0.4"
coverage = "^7.3.0"
pytest = "^9.0.2"

[tool.poetry.scripts]
dyngle = "dyngle:DyngleApp.main"

[tool.semantic_release]
version_toml = ["pyproject.toml:tool.poetry.version"]
tag_format = "v{version}"
build_command = ""

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.remote.token]
env = "GH_TOKEN"

[tool.semantic_release.publish]
upload_to_vcs_release = false
